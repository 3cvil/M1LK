<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="M1LK logo: a milk splash in a glass">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1222"/>
      <stop offset="0.55" stop-color="#16243f"/>
      <stop offset="1" stop-color="#25406b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.55">
      <stop offset="0" stop-color="#3b6fb5" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#3b6fb5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2e8f0" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#e2e8f0" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="milk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8eef5"/>
      <stop offset="0.45" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d6dfea"/>
    </linearGradient>
    <linearGradient id="splash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4ebf3"/>
    </linearGradient>
    <clipPath id="inside">
      <path d="M161 190 L351 190 L329 444 Q326 468 302 468 L210 468 Q186 468 183 444 Z"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect width="512" height="512" rx="96" fill="url(#glow)"/>

  <!-- milk -->
  <g clip-path="url(#inside)">
    <rect x="150" y="196" width="220" height="280" fill="url(#milk)"/>
  </g>

  <!-- crown splash rising out of the milk -->
  <path d="M160 200
           C176 198 184 192 186 182
           Q196 190 206 186
           C212 176 214 164 218 156
           Q224 172 234 182
           C240 166 246 146 252 134
           C258 150 262 170 270 184
           Q280 178 286 172
           C290 160 296 150 304 142
           C304 158 306 176 312 188
           Q326 190 334 180
           C334 192 340 198 352 200
           Q256 214 160 200 Z"
        fill="url(#splash)" stroke="url(#splash)" stroke-width="4" stroke-linejoin="round"/>
  <!-- a few droplets -->
  <g fill="#ffffff">
    <circle cx="249" cy="114" r="6"/>
    <circle cx="308" cy="124" r="5"/>
    <circle cx="216" cy="140" r="3.5"/>
    <circle cx="322" cy="104" r="2.5"/>
    <circle cx="262" cy="98" r="2.5"/>
  </g>

  <!-- glass -->
  <path d="M154 150 L358 150 L335 446 Q331 476 302 476 L210 476 Q181 476 177 446 Z"
        fill="url(#glass)" stroke="#cbd5e1" stroke-width="8" stroke-linejoin="round"/>
  <path d="M182 214 L198 440" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.35"/>
</svg>
